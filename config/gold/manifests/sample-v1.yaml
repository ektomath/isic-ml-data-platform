# A training release: which datasets, how many images, and how they're split.
# sample-v1 is a small sample (100 images per dataset) for trying the pipeline cheaply.
# sample_seed picks the images, split_seed divides them into splits; keep sample_seed fixed
# to compare releases over the same images.
dataset_version: sample-v1
dataset_keys: [isic_2019, milk10k]
label_column: malignancy
sample_size_per_dataset: 100
sample_seed: 42
split_ratios: [0.7, 0.15, 0.15]
split_seed: 42
preprocessing_version: sample-v1
