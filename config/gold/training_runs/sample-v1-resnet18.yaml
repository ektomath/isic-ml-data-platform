# One training run: the release and preprocessing recipe it uses, and its hyperparameters
# (ADR 007). Training takes only this file's name.

training_run_name: sample-v1-resnet18

dataset_version: sample-v1
preprocessing_version: sample-v1   # resolves to config/preprocessing/sample-v1.yaml

# Class index = position in this list.
label_values: [benign, malignant, indeterminate]

architecture: resnet18
pretrained: true

batch_size: 32
num_epochs: 5
learning_rate: 0.0003
optimizer: adam   # adam | sgd

# Optional; defaults to ml.mlflow_utils.DEFAULT_MLFLOW_EXPERIMENT.
mlflow_experiment: /Shared/isic_ml_data_platform/baseline_training

# Optional; also registers the model as a new version of this Unity Catalog model.
registered_model_name: isic_ml_data_platform.gold.baseline_classifier
