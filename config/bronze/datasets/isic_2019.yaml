# ISIC 2019: which archives to ingest and which columns feed the Silver labels.
dataset_key: isic_2019
source_version: "2019"
archives:
  - source_split: train
    archive_filename: ISIC-2019-train-images.zip
    metadata_filename: metadata.csv
  - source_split: test
    archive_filename: ISIC-2019-test-images.zip
    metadata_filename: metadata.csv
# Diagnosis columns read by normalize_diagnosis_labels, and the Silver label columns it fills.
diagnosis_input_columns: [diagnosis_1, diagnosis_2, diagnosis_3]
label_columns: [malignancy, specific_diagnosis]
