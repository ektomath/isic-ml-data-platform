# MILK10k: which archive to ingest and which columns feed the Silver labels.
# One archive with no train/test split. The dataset has no version tag, so source_version
# is just its name.
dataset_key: milk10k
dataset_name: isic/milk10k
source_version: "milk10k"
archives:
  - source_split: all
    archive_filename: milk10k.zip
    metadata_filename: metadata.csv
# Diagnosis columns read by normalize_diagnosis_labels, and the Silver label columns it fills.
diagnosis_input_columns: [diagnosis_1, diagnosis_2, diagnosis_3, diagnosis_4]
label_columns: [malignancy, specific_diagnosis]
