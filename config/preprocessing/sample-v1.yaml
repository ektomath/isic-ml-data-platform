# Image preprocessing for the baseline ResNet-18, applied when training loads images, never
# to stored bytes (ADR 001). Training-run configs pick a recipe by name.

preprocessing_version: sample-v1

image_size: 224

normalization:
  mean: [0.485, 0.456, 0.406]   # ImageNet values, matching the pretrained weights
  std: [0.229, 0.224, 0.225]

resize_shorter_side: 256   # then cropped to image_size: random for train, center otherwise

augmentation:
  train:
    random_horizontal_flip: true
    random_rotation_degrees: 15

random_seed: 42
