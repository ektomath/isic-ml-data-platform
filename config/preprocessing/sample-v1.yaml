# Preprocessing recipe for the sample-v1 baseline ResNet-18 classifier. Decoupled from any one
# dataset_version -- config/gold/training_runs/<name>.yaml is what pins a specific pairing (see
# docs/decisions/007-pin-data-and-preprocessing-per-training-run.md). Fields match the
# config/preprocessing/<name>.yaml contract in docs/data_contract.md. Never applied to stored bytes --
# resolved into transforms at training time only (docs/decisions/001-preprocessing-at-runtime.md).

preprocessing_version: sample-v1

image_size: 224

normalization:
  mean: [0.485, 0.456, 0.406]   # ImageNet channel means -- matches the pretrained ResNet-18 weights
  std: [0.229, 0.224, 0.225]

resize_policy: shorter_side_to_256   # resize the shorter side to 256px, preserving aspect ratio

crop_policy:
  train: random_crop_224
  eval: center_crop_224

augmentation:
  train:
    random_horizontal_flip: true
    random_rotation_degrees: 15
  eval: []   # validation/test get resize + crop + normalize only, no augmentation

random_seed: 42

framework_runtime_notes: >
  Built for torchvision.transforms operating on PIL images decoded from raw MDS shard bytes at
  load time -- never baked into shard bytes. Compose order: Resize(shorter side) -> (RandomCrop
  + flip + rotation for train / CenterCrop for eval) -> ToTensor -> Normalize(mean, std).
  Resolved by src.ml.preprocessing.build_transforms, one Compose per split.
