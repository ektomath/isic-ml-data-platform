# The Unity Catalog catalog everything lives in. Notebook 00 creates it if it doesn't exist.
# The paths and table name below must use the same catalog; this is checked on load.
catalog: isic_ml_data_platform

# Shared Unity Catalog volume roots.
landing_root: /Volumes/isic_ml_data_platform/bronze/landing
storage_root: /Volumes/isic_ml_data_platform/bronze/files

# The Gold manifest table training runs record as their input (MLflow log_input).
manifest_table: isic_ml_data_platform.gold.manifest_rows
