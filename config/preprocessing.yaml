# Versioned preprocessing settings referenced by gold.manifest_rows.preprocessing_version.
# Resize/crop/augmentation values are model- and experiment-specific per
# docs/decisions/001-preprocessing-at-runtime.md and the "Preprocessing placement"
# table in docs/ISIC_2019_Data_Engineering_Project_Plan_v3.md -- actual pixel
# transforms happen at training/inference runtime, not here. This file versions
# the values, it never resizes or stores a transformed image.

version: sample-v1

image_size: 224
normalization: imagenet

resize_policy: shortest_side_then_center_crop
crop_policy: center_crop_224
augmentation_policy: none # no augmentation for this sample; revisit once training exists

random_seed: 42

# Framework-specific runtime notes intentionally omitted: no training framework
# is chosen yet (src/ml/train.py is still a stub). Add this field once one is.
