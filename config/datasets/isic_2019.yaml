dataset_key: isic_2019
dataset_name: isic/2019
source_version: "2019"
bronze_prefix: isic_2019
silver_prefix: silver/isic_2019
gold_prefix: null
archives:
  - source_split: train
    archive_filename: ISIC-2019-train-images.zip
    metadata_filename: metadata.csv
  - source_split: test
    archive_filename: ISIC-2019-test-images.zip
    metadata_filename: metadata.csv
# Raw Bronze diagnosis columns fed to normalize_diagnosis_labels (arity-agnostic,
# shared with every other dataset) and the shared Silver label columns it produces.
diagnosis_input_columns: [diagnosis_1, diagnosis_2, diagnosis_3]
label_columns: [malignancy, specific_diagnosis]
