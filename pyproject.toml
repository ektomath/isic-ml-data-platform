[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isic-vision-data-platform"
version = "0.1.0"
description = "ISIC data platform for Bronze/Silver/Gold image workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
