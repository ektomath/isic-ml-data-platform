[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isic-ml-data-platform"
version = "0.1.0"
description = "ISIC data platform for Bronze/Silver/Gold image workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "Pillow",
  "pandas",
  "mosaicml-streaming==0.13.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "mlflow-skinny==3.15.2",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
# For tests/test_spark_io.py, which runs the Spark transformations on a local SparkSession
# (also needs Java). Databricks provides its own Spark, so the pipeline itself never installs this.
spark = [
  "pyspark>=3.5,<4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
