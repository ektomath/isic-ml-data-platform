[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isic-vision-data-platform"
version = "0.1.0"
description = "ISIC data platform for Bronze/Silver/Gold image workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
  "Pillow",
  "pandas",
  "mosaicml-streaming==0.13.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "mlflow-skinny==3.15.2",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
